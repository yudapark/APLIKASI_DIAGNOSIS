{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<section class="card error-card">
  <div class="mini-icon warn"><i data-lucide="alert-octagon"></i></div>
  <h1>{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  <a href="{{ url_for('identifikasi') }}" class="btn btn-primary">
    <i data-lucide="home"></i> Kembali ke Identifikasi
  </a>
</section>
{% endblock %}
